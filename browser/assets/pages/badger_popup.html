<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Badger</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fdfdfd;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    width: 390px;
    min-height: 420px;
    padding: 12px 14px;
    user-select: none;
    overflow-x: hidden;
  }
  
  /* Header */
  #privacy-badger-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 2px solid #e2e8f0;
    margin-bottom: 12px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badger-logo {
    width: 44px;
    height: 44px;
  }
  .title-group {
    display: flex;
    flex-direction: column;
  }
  .title-group h2 {
    font-size: 16px;
    font-weight: 800;
    color: #1a202c;
    letter-spacing: -0.2px;
  }
  .eff-tag {
    font-size: 11px;
    color: #dc2626;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .eff-tag span {
    color: #718096;
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .icon-btn:hover {
    background: #edf2f7;
  }
  .icon-btn img {
    width: 18px;
    height: 18px;
    opacity: 0.75;
  }

  /* Status Banner */
  .status-box {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .domain-title {
    font-weight: 700;
    color: #2d3748;
    font-size: 13px;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .tracker-count-text {
    font-size: 12px;
    color: #4a5568;
  }
  .tracker-count-text b {
    color: #dc2626;
    font-size: 13px;
  }

  /* Legend */
  .legend-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 4px 6px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #718096;
    font-weight: 600;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-red { background: #ef4444; }
  .dot-yellow { background: #eab308; }
  .dot-green { background: #22c55e; }

  /* Tracker List */
  .trackers-container {
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fff;
    margin-bottom: 12px;
  }
  .tracker-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-bottom: 1px solid #edf2f7;
    font-size: 12px;
  }
  .tracker-row:last-child {
    border-bottom: none;
  }
  .tracker-name {
    font-family: monospace;
    color: #334155;
    max-width: 190px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  /* 3-State Slider */
  .tri-switch {
    display: flex;
    background: #334155;
    border-radius: 12px;
    padding: 2px;
    width: 90px;
    position: relative;
  }
  .tri-btn {
    flex: 1;
    text-align: center;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    color: #94a3b8;
    padding: 2px 0;
    border-radius: 10px;
    transition: all 0.15s ease;
    z-index: 1;
  }
  .tri-btn.active.red {
    background: #ef4444;
    color: #fff;
  }
  .tri-btn.active.yellow {
    background: #eab308;
    color: #000;
  }
  .tri-btn.active.green {
    background: #22c55e;
    color: #fff;
  }

  .empty-trackers {
    padding: 24px 16px;
    text-align: center;
    color: #059669;
    font-size: 12px;
    line-height: 1.5;
  }

  /* Site Action Buttons */
  .actions-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .pb-btn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
  }
  .pb-btn:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
  }
  .pb-btn.btn-disable {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #991b1b;
  }
  .pb-btn.btn-disable:hover {
    background: #fecaca;
  }
  .pb-btn.btn-enable {
    background: #dcfce7;
    border-color: #86efac;
    color: #166534;
  }
  .pb-btn.btn-enable:hover {
    background: #bbf7d0;
  }

  /* Footer */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #64748b;
  }
  footer a {
    color: #dc2626;
    text-decoration: none;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="privacy-badger-header">
  <div class="header-left">
    <img src="tux://assets/icons/badger-48.png" class="badger-logo" alt="Privacy Badger">
    <div class="title-group">
      <h2>Privacy Badger</h2>
      <div class="eff-tag">EFF <span>Electronic Frontier Foundation</span></div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" title="Настройки Privacy Badger" onclick="openOptions()"><img src="tux://assets/icons/settings.svg" alt="Settings"></button>
    <button class="icon-btn" title="Поделиться" onclick="shareStats()"><img src="tux://assets/icons/star.svg" alt="Share"></button>
  </div>
</div>

<div class="status-box">
  <div class="domain-title">Сайт: {{DOMAIN}}</div>
  <div class="tracker-count-text">
    {{STATUS_MESSAGE}}
  </div>
</div>

<div class="legend-bar">
  <div class="legend-item"><span class="dot dot-red"></span> Блок</div>
  <div class="legend-item"><span class="dot dot-yellow"></span> Без куки</div>
  <div class="legend-item"><span class="dot dot-green"></span> Разрешить</div>
</div>

<div class="trackers-container">
  {{TRACKERS_LIST_HTML}}
</div>

<div class="actions-box">
  {{TOGGLE_SITE_BUTTON}}
  <button class="pb-btn" onclick="openReport()">
    ✉️ Сообщить о неработающем сайте
  </button>
</div>

<footer>
  <a href="https://eff.org/donate" target="_blank">❤️ Поддержать EFF</a>
  <div>v2026.8.7 (FishTux)</div>
</footer>

<script>
  function openOptions() {
    window.location.href = "tux://action?type=open_tab&url=tux://shield";
  }
  function shareStats() {
    alert("Privacy Badger защищает ваш браузер от отслеживания!");
  }
  function toggleSite(domain) {
    fetch("tux://action?type=toggle_badger_whitelist&domain=" + encodeURIComponent(domain))
      .then(() => {
        window.location.reload();
      });
  }
  function openReport() {
    alert("Спасибо! Отчет отправлен в локальную базу данных FishTux.");
  }
  function setTrackerState(trDomain, state, el) {
    const parent = el.parentElement;
    parent.querySelectorAll('.tri-btn').forEach(b => b.className = 'tri-btn');
    el.classList.add('active', state);
  }
</script>

</body>
</html>
