<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tux Закладки ⭐</title>
  <style>
    :root {
      --bg: #1c1b22;
      --card-bg: #2b2a33;
      --card-border: #38383d;
      --tux-gold: #ff7139;
      --ice-cyan: #00ddff;
      --text: #fbfbfe;
      --text-muted: #bfbfc9;
      --danger: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-group h1 {
      font-size: 1.7rem;
      color: var(--tux-gold);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
      position: relative;
    }
    .card:hover {
      border-color: var(--tux-gold);
      transform: translateY(-2px);
    }
    .card-link {
      text-decoration: none;
      color: var(--text);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-url {
      font-size: 0.8rem;
      color: var(--ice-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
    }
    .card-category {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #21262d;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .del-btn:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="title-group">
        <span style="font-size:1.8rem;">⭐</span>
        <h1>Закладки Tux</h1>
      </div>
      <button class="card-category" style="padding:6px 14px;cursor:pointer;color:#fff;" onclick="window.location.href='tux://home'">← В меню</button>
    </div>

    <div class="grid">
      {{BOOKMARK_ITEMS}}
    </div>
  </div>

  <script>
    async function deleteBookmark(url) {
      if (confirm('Удалить эту закладку?')) {
        try {
          await fetch('tux://action?type=delete_bookmark&url=' + encodeURIComponent(url));
          window.location.reload();
        } catch (e) {
          window.location.href = 'tux://action?type=delete_bookmark&url=' + encodeURIComponent(url);
        }
      }
    }
  </script>
</body>
</html>
